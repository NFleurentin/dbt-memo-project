version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique

          - not_null
      - name: email
        data_tests:
          - not_null:
              config:
                severity: warn # Juste un avertissement, pas bloquant
                store_failures: true # Conserver les échecs pour analyse
